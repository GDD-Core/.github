name: CI
on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

jobs:
  esteira:
    uses: GDD-Core/esteiras-workflows/.github/workflows/ci-srv-java.yml@main
    with:
      java-version: "21"
      publicar: ${{ github.event_name != 'pull_request' }}
      docker: true
      registry: registry.meucardapioqrcode.com.br
      docker-push: ${{ github.event_name != 'pull_request' }}
    secrets:
      NEXUS_MAVEN_USER: ${{ secrets.NEXUS_MAVEN_USER }}
      NEXUS_MAVEN_PASS: ${{ secrets.NEXUS_MAVEN_PASS }}
      NEXUS_DOCKER_USER: ${{ secrets.NEXUS_DOCKER_USER }}
      NEXUS_DOCKER_PASS: ${{ secrets.NEXUS_DOCKER_PASS }}

  # O deploy E este job: renderiza o manifesto e commita em <app>-config, dispara
  # o sync explicito no ArgoCD e verifica (Synced/Healthy). Autosync desligado.
  cd:
    if: ${{ github.event_name != 'pull_request' }}
    needs: esteira
    uses: GDD-Core/esteiras-workflows/.github/workflows/cd.yml@main
    with:
      chart: srv-java
    secrets:
      ESTEIRA_CONFIG_PAT: ${{ secrets.ESTEIRA_CONFIG_PAT }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
